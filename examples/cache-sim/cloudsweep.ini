# cloudsweep.ini for the example cache simulator.

[project]
name = cachesim

[image]
dockerfile = cloud/Dockerfile
check = gcc --version && make --version

[build]
command = make
binary = build/cachesim

[run]
vcpus = 1
memory_mib = 1024
hours = 0.25

# A new base image must reproduce this run's result exactly before it is published.
[acceptance]
command = ["{bin}", "--sets", "64", "--ways", "4", "--accesses", "200000", "--seed", "7", "--out", "{out}"]
check = cmp {out}/result.json tests/reference.json
