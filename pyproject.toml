[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsweep"
version = "0.1.0"
description = "Run simulator sweeps on AWS Batch from a Git project, within a budget"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = []
keywords = ["aws", "batch", "simulation", "parameter-sweep", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/nikhila9arwal/cloudsweep"
Documentation = "https://github.com/nikhila9arwal/cloudsweep#documentation"
Issues = "https://github.com/nikhila9arwal/cloudsweep/issues"
Changelog = "https://github.com/nikhila9arwal/cloudsweep/blob/main/CHANGELOG.md"

[project.scripts]
cloudsweep = "cloudsweep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudsweep = ["stack.yaml"]
