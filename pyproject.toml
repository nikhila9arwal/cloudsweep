[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsweep"
version = "0.1.0"
description = "Run simulator sweeps on AWS Batch from a Git project, within a budget"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cloudsweep = "cloudsweep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudsweep = ["stack.yaml"]
