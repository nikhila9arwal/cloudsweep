name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # Newer runner images no longer provide Python 3.9.
          - python: "3.9"
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pyyaml
      - run: python -m unittest discover -s tests -v

  worker-python38:
    # The worker runs inside users' images, which may have Python 3.8.
    name: worker compiles on Python 3.8
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.8"
      - run: python -m py_compile src/cloudsweep/core.py src/cloudsweep/worker.py src/cloudsweep/s3lite.py

  machine-python36:
    # On users' machines the worker runs under the system Python, which may be 3.6.
    name: machine code imports on Python 3.6
    runs-on: ubuntu-latest
    container: python:3.6-slim
    steps:
      - uses: actions/checkout@v4  # its Node 20 runs on this image's older C library
      - run: cd src/cloudsweep && python -c "import core, worker, remote"

  template:
    name: CloudFormation template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - run: cfn-lint src/cloudsweep/stack.yaml
